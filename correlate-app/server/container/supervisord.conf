; Runs the Sump's three processes in one container, as the non-root user
; `sump` (REQ-000004-sJpO9KMY Requirement 5). Everything logs to the
; container's stdout and stderr.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:redis]
; Redis listens on 127.0.0.1 inside the container only, and the compose file
; never publishes it. No persistence: records are a capped buffer
; (br-RECORD-000004-sJpO9KMY); recordings are how data is kept.
command=redis-server --bind 127.0.0.1 --port 6379 --protected-mode yes --save "" --appendonly no
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:sump]
; SUMP_HOST=0.0.0.0 is set in the image so Docker can publish the port; the
; compose file publishes it on 127.0.0.1 only (br-SUMP-000009-sJpO9KMY).
command=python -m correlate_sump
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fluent-bit]
command=/opt/fluent-bit/bin/fluent-bit -c /etc/fluent-bit/fluent-bit.conf
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
