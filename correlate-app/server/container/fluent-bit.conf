# Fluent Bit for the Sump (REQ-000004-sJpO9KMY Requirement 5).
#
# Takes one record per line on TCP 5140 and forwards each line unchanged to the
# Sump's ingest adapter on 127.0.0.1:5170, which validates it
# (br-RECORD-000001-sJpO9KMY). The input does not parse JSON: with `Format
# none` the whole line lands in the `log` key, and `raw_message_key $log` (a
# record accessor) sends exactly that line on, one per line. In Fluent Bit 5.x,
# a bare `log` sends the literal word "log", and correlator's `Format raw` is
# not a valid option (it falls back to msgpack). (correlator parsed JSON here and forwarded only a
# `message` field, which needed every sender to wrap records in an envelope.)

[SERVICE]
    Flush        1
    Log_Level    info

[INPUT]
    Name         tcp
    # Inside the container; the compose file publishes it on 127.0.0.1 only.
    Listen       0.0.0.0
    Port         5140
    Format       none
    Tag          sump.ingest

[OUTPUT]
    Name             tcp
    Match            sump.ingest
    Host             127.0.0.1
    Port             5170
    Format           json_lines
    raw_message_key  $log
