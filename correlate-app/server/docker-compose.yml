# The Sump for local runs: `task server:up`, `task server:down`, `task server:logs`.
#
# Every published port binds to 127.0.0.1 only, and Redis is not published at
# all (br-SUMP-000009-sJpO9KMY); tests/test_compose.py fails otherwise.

# Its own project name: compose otherwise names projects after their folder,
# and correlator's compose file also lives in a folder called `server`.
name: correlate-sump

services:
  sump:
    build: .
    image: correlate-sump:dev
    ports:
      - "127.0.0.1:${SUMP_PORT:-8765}:8765"
      - "127.0.0.1:${SUMP_FLUENT_PORT:-5140}:5140"
    environment:
      SUMP_RECORD_MAXLEN: ${SUMP_RECORD_MAXLEN:-100000}
      # Users and their public keys (br-CONN-000007-sJpO9KMY): kept on a
      # volume, since Redis in the container is not saved to disk.
      SUMP_DATA_DIR: /var/lib/correlate-sump
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    # The host's Docker, for the SSH plugin's "self" data stream
    # (REQ-000024-sJpO9KMY): the socket, and its group, which the app reads
    # with the image (0 under Docker Desktop; on Linux, the docker group's).
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    volumes:
      - sump-data:/var/lib/correlate-sump
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  sump-data:
