# The Sump's SSH data-stream plugin (REQ-000024-sJpO9KMY): local and SSH
# transports and the Docker host data source, found by the Sump through the
# `sump.plugins` entry point (br-PLUGIN-000001-sJpO9KMY). A member of the
# server's uv workspace; ported from correlator's `sump-plugin-ssh` (D6).

[project]
name = "correlate-sump-plugin-ssh"
version = "0.1.0"
description = "correlate-app Sump plugin: local and SSH transports, Docker hosts as data streams"
readme = "README.md"
requires-python = ">=3.13"
# The Sump's plugin core, and paramiko: SSH in Python, never the ssh binary.
dependencies = ["correlate-sump", "paramiko>=3.5"]

# How the Sump finds this plugin.
[project.entry-points."sump.plugins"]
ssh = "sump_plugin_ssh.plugin:plugin"

[tool.uv.sources]
# The Sump from this workspace, not a registry.
correlate-sump = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The one import package this plugin ships.
packages = ["src/sump_plugin_ssh"]
