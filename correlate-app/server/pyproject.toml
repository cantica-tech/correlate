# correlate-app's Sump server (`server/`): the Python project that collects
# telemetry and logs and serves them to the client (br-BUILD-000001).

[project]
# Distribution name; the import package is `correlate_sump`.
name = "correlate-sump"
version = "0.1.0"
description = "correlate-app's Sump: the containerized telemetry and log collector"
readme = "README.md"
# Python 3.13, pinned by .python-version (br-BUILD-000003).
requires-python = ">=3.13"
# fastapi: plugins contribute routes to the Sump's FastAPI app.
dependencies = [
    "cryptography>=46",
    "fastapi>=0.141.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pluggy>=1.6.0",
    "redis>=5.0",
    "uvicorn>=0.32",
]

[dependency-groups]
# Development tools: tests, lint and type-check (br-BUILD-000003).
dev = [
    "fakeredis>=2.26",
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0",
    "ruff>=0.7",
    "ty>=0.0.71",
]

[project.scripts]
# Run the Sump (src/correlate_sump/__main__.py).
correlate-sump = "correlate_sump.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The one import package this project ships.
packages = ["src/correlate_sump"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear and async rules.
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers belong in argument defaults (B008).
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ty.environment]
python-version = "3.13"
